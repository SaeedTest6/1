# An Apple Watch install on the runner, the way Monolith's app does it on a phone:
# vphone's resources, monolith-fw, then new / set-patches / prepare (which restores cloudOS on the engine to take its
# GPU driver) / patch for Watch7,18.
# Apple's firmware is downloaded to the runner's temp folder and is never uploaded or committed.
name: Watch

on:
  workflow_dispatch: {}

jobs:
  stage1:
    runs-on: xcode-27
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Disk
        run: |
          df -h / | tail -1
          # Free space the build does not need: simulator runtimes, old toolchains, caches.
          sudo rm -rf /Library/Developer/CoreSimulator/Volumes /Library/Developer/CoreSimulator/Images /Library/Developer/CoreSimulator/Caches 2>/dev/null || true
          rm -rf "$HOME/Library/Developer/CoreSimulator" "$HOME/Library/Caches" "$HOME/.cache" "$HOME/.dotnet" "$HOME/.rustup" "$HOME/.gradle" "$HOME/Library/Android" 2>/dev/null || true
          sudo rm -rf /Users/runner/hostedtoolcache /Users/runner/Library/Android /usr/local/share/dotnet /Library/Frameworks/Mono.framework 2>/dev/null || true
          df -h / | tail -1
      - name: Clone Monolith and vphone-cli
        run: |
          git clone --depth 1 https://github.com/MakrSas/Monolith.git "$RUNNER_TEMP/Monolith"
          git clone --depth 1 https://github.com/Lakr233/vphone-cli.git "$RUNNER_TEMP/vphone-cli"
          git -C "$RUNNER_TEMP/vphone-cli" log -1 --format='vphone-cli %h %s'
          echo "VPHONE_SHA=$(git -C "$RUNNER_TEMP/vphone-cli" rev-parse HEAD)" >> "$GITHUB_ENV"
          git -C "$RUNNER_TEMP/Monolith" apply "$GITHUB_WORKSPACE"/monolith-patches/*.patch
      - name: VPhone.bundle cache
        id: vcache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vphone-cli/.build/XcodeBundle/Build/Products/Release/VPhone.bundle
          key: vphone-bundle-${{ env.VPHONE_SHA }}
      - name: Build VPhone.bundle (as vphone's own package workflow does)
        if: steps.vcache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/vphone-cli
        env:
          SWIFT_JOBS: "4"
        run: |
          set +e
          xcodebuild -workspace VPhone.xcworkspace -scheme VPhone -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath .build/XcodeBundle -jobs 4 build \
            2>&1 | tail -40
          B=.build/XcodeBundle/Build/Products/Release/VPhone.bundle
          ls "$B/Contents/Resources" | head -40
          echo "VPHONE_RESOURCES=$PWD/$B/Contents/Resources" >> "$GITHUB_ENV"
      - name: VPhone resources path
        run: echo "VPHONE_RESOURCES=$RUNNER_TEMP/vphone-cli/.build/XcodeBundle/Build/Products/Release/VPhone.bundle/Contents/Resources" >> "$GITHUB_ENV"
      - name: Tools for the engine
        run: brew install pkg-config libslirp glib libplist libusbmuxd libimobiledevice libimobiledevice-glue libtatsu libzip curl cmake meson ninja
      - name: Build hengevm
        working-directory: ${{ runner.temp }}/Monolith
        run: |
          tools/build_ios_restore.sh mac 2>&1 | tail -5
          make -j4 build/hengevm 2>&1 | tail -15
          echo "HENGEVM=$PWD/build/hengevm" >> "$GITHUB_ENV"
      - name: Build monolith-fw
        working-directory: ${{ runner.temp }}/Monolith/third_party/vphone-patcher
        run: |
          swift build -c release --product monolith-fw 2>&1 | tail -30
          echo "FW=$PWD/.build/release/monolith-fw" >> "$GITHUB_ENV"
      - name: "Watch7,18: new, set-patches, prepare, patch"
        run: |
          set +e
          export VPHONE_ROOT="$RUNNER_TEMP/vroot" MONOLITH_RESOURCES="$VPHONE_RESOURCES"
          export MONOLITH_HENGEVM="$HENGEVM" MONOLITH_ROM_DIR="$RUNNER_TEMP/library/m-watch" MONOLITH_RESTORE_LOG="$RUNNER_TEMP/cloudos-restore.log"
          ulimit -s 65520
          LIB="$RUNNER_TEMP/library"; mkdir -p "$LIB" "$VPHONE_ROOT"
          "$FW" new "$LIB" m-watch "$VPHONE_RESOURCES" 64
          "$FW" fw set-patches -l "$LIB" m-watch --preset watchos-monolith
          "$FW" fw prepare -l "$LIB" m-watch --device "Watch7,18" \
            -i "https://updates.cdn-apple.com/2026SpringFCS/fullrestores/122-09130/486B2E2B-DEDB-4DCF-80F0-7A84ED51B074/Watch7,18_26.4_23T240_Restore.ipsw" \
            -c "https://updates.cdn-apple.com/private-cloud-compute/6acb7959507f25a76753f5a08ee39f09671486eb7619367e42dc1869bd779035" > "$RUNNER_TEMP/prepare.log" 2>&1; prc=$?; echo "prepare exit code: $prc"; tail -15 "$RUNNER_TEMP/prepare.log" | cut -c1-300; [ $prc -eq 0 ] || exit 1
          "$FW" fw kernelcache -l "$LIB" m-watch > "$RUNNER_TEMP/kc-stage.log" 2>&1; krc=$?; echo "kernelcache stage exit code: $krc"; tail -20 "$RUNNER_TEMP/kc-stage.log" | cut -c1-300; [ $krc -eq 0 ] || exit 1
          sudo -E "$FW" fw kernelcache -l "$LIB" m-watch --link-only > "$RUNNER_TEMP/kc-link.log" 2>&1; lrc=$?; echo "kernelcache link exit code: $lrc"; tail -10 "$RUNNER_TEMP/kc-link.log" | cut -c1-300; [ $lrc -eq 0 ] || exit 1
          sudo -E "$FW" fw patch -l "$LIB" m-watch > "$RUNNER_TEMP/patch.log" 2>&1; rc=$?; echo "patch exit code: $rc"; tail -25 "$RUNNER_TEMP/patch.log" | cut -c1-300; dmesg 2>/dev/null | tail -3; [ $rc -eq 0 ] || exit 1
          M="$LIB/m-watch"
          df -h / | tail -1; du -sh "$VPHONE_ROOT"/* 2>/dev/null | sort -h | tail -6
          ls -la "$M" | head -30
          [ -f "$M/SEPStorage" ] || head -c 524288 /dev/zero > "$M/SEPStorage"
          if [ ! -f "$M/nvram.bin" ]; then
            printf '\xa5\xd5\xb3\xfe\x97\xad\x1d\x27\x01\x00\x00\x00\x00\x00\x00\x00\x01\x00\x00\x00\x00\x00\x00\x00' > "$M/nvram.bin"
            truncate -s 33570816 "$M/nvram.bin"
          fi
          [ -f "$M/Disk.img" ] || { : > "$M/Disk.img"; truncate -s 64G "$M/Disk.img"; }
          TREE=$(ls -d "$M"/*_Restore | tail -1)
          ECID=$((RANDOM * 32768 * 65536 + RANDOM + 1099511627776)); echo "$ECID" > "$RUNNER_TEMP/watch-ecid"
          mkdir -p "$RUNNER_TEMP/rwork"
          HV_MACHINE=vresearch101 HV_INSTALL_STOP_AT_END=1 HV_WRITE_CACHE=0 "$HENGEVM" --rom "$M/OpenAVB.bin" --sep-rom "$M/OpenSEP.bin" --sep-storage "$M/SEPStorage" \
            --disk "$M/Disk.img" --aux "$M/nvram.bin" --ecid "$ECID" --ram 2048 --cpus 4 --no-pvg --log 0 --install "$TREE" > "$RUNNER_TEMP/watch-restore.log" 2>&1 &
          RP=$!
          for i in $(seq 1 180); do
            sleep 10
            if grep -q "install: done\|install: failed\|install: restore finished" "$RUNNER_TEMP/watch-restore.log"; then sleep 20; break; fi
            kill -0 $RP 2>/dev/null || break
            [ $((i % 6)) -eq 0 ] && grep "install:" "$RUNNER_TEMP/watch-restore.log" | tail -1
          done
          kill $RP 2>/dev/null; sleep 3
          echo "--- watch restore log"; grep -E "install:|panic|stopped" "$RUNNER_TEMP/watch-restore.log" | tail -15 | cut -c1-200
          grep -q "install: done" "$RUNNER_TEMP/watch-restore.log" || { echo "--- before the failure"; grep -v -E "^[0-9a-f]{8,}:[0-9]+$" "$RUNNER_TEMP/watch-restore.log" | grep -v "Uploading:" | cut -c1-240 | head -120; echo "--- patched components"; grep -E "^  (iBSS|iBEC|LLB|TXM|kernelcache|SEP|DeviceTree|RestoreSEP)|patches applied|Applying|iBoot" "$RUNNER_TEMP/patch.log" | cut -c1-200 | head -40; ls -la "$M/iPhoneOS_Watch7,18_26.4_23T240_Restore/Firmware/dfu" | head -20; echo "--- errors"; grep -n -i "error\|fail\|unable\|invalid" "$RUNNER_TEMP/watch-restore.log" | cut -c1-240 | tail -25; exit 1; }
          sudo -E MONOLITH_APFS=1 "$FW" restored-system "$M" "$VPHONE_RESOURCES" > "$RUNNER_TEMP/restored-system.log" 2>&1; rsrc=$?
          echo "restored-system exit code: $rsrc"; tail -25 "$RUNNER_TEMP/restored-system.log" | cut -c1-250
          [ $rsrc -eq 0 ] || exit 1
          df -h / | tail -1; du -sh "$LIB/m-watch" "$VPHONE_ROOT" 2>/dev/null
      - name: Boot the restored watch
        run: |
          set +e
          M="$RUNNER_TEMP/library/m-watch"
          ECID=$(cat "$RUNNER_TEMP/watch-ecid")
          ulimit -s 65520
          HV_MACHINE=vresearch101 HV_SEP_LOG=1 "$HENGEVM" --rom "$M/OpenAVB.bin" --sep-rom "$M/OpenSEP.bin" \
            --sep-storage "$M/SEPStorage" --disk "$M/Disk.img" --aux "$M/nvram.bin" --ecid "$ECID" --ram 3072 --cpus 4 --no-pvg --log 0 \
            --screenshot "$RUNNER_TEMP/watch-boot.png" > "$RUNNER_TEMP/watch-boot.log" 2>&1 &
          BP=$!
          L="$RUNNER_TEMP/watch-boot.log"
          for i in $(seq 1 15); do
            sleep 120
            kill -0 $BP 2>/dev/null || { echo "hengevm exited"; break; }
            echo "=== t=$((i*2)) min: $(wc -l < "$L") lines, apfs-clone: $(grep -c apfs_clonegroup "$L"), last non-noise lines:"
            grep -v -E "^[0-9a-f]{8,}:[0-9]+$|apfs_clonegroup|SEP RX" "$L" | tail -4 | cut -c1-200
          done
          kill $BP 2>/dev/null; sleep 3
          echo "=== final"; grep -v -E "^[0-9a-f]{8,}:[0-9]+$|apfs_clonegroup|SEP RX" "$L" | tail -80 | cut -c1-220
          echo "=== what ran (counts of marker strings in the whole boot log)"
          for k in SpringBoard backboardd carousel Carousel ClockFace NanoLaunch nanoregistryd watchdogd mobilegestalt "Process 1 " panic Panic "unmapped" "undefined"; do printf '%-14s %s\n' "$k" "$(grep -a -c "$k" "$L")"; done
          echo "=== screenshot"
          ls -la "$RUNNER_TEMP/watch-boot.png" 2>&1
          python3 -m pip install --quiet --break-system-packages pillow 2>&1 | tail -1
          python3 - "$RUNNER_TEMP/watch-boot.png" <<'PY'
          import sys
          try:
              from PIL import Image
              im = Image.open(sys.argv[1]).convert("L"); print("size", im.size)
              w, h = im.size; nz = sum(1 for v in im.getdata() if v > 16); print("non-black pixels: %.1f%%" % (100.0 * nz / (w * h)))
              sm = im.resize((48, 28)); chars = " .:-=+*#%@"
              for y in range(28): print("".join(chars[min(9, sm.getpixel((x, y)) * 10 // 256)] for x in range(48)))
          except Exception as e:
              print("no screenshot analysis:", e)
          PY
        shell: bash
      - name: Pack the watch for the Monolith app
        run: |
          set -e
          M="$RUNNER_TEMP/library/m-watch"
          O="$RUNNER_TEMP/export/Watch7-18"; mkdir -p "$O"
          make -C "$RUNNER_TEMP/Monolith" build/hvsparse >/dev/null
          cp "$M/OpenAVB.bin" "$O/AVPBooter.vmapple2.bin"
          cp "$M/OpenSEP.bin" "$O/OpenSEP.bin"
          cp "$M/nvram.bin" "$O/auxiliary.bin"
          cp "$M/SEPStorage" "$O/SEPStorage"
          "$RUNNER_TEMP/Monolith/build/hvsparse" pack "$M/Disk.img" "$O/disk.img.hvsparse"
          ECID=$(cat "$RUNNER_TEMP/watch-ecid")
          printf '{"name": "Apple Watch", "ecid": %s, "seed": 0, "ramMB": 3072, "platform": "vresearch101", "screenWidth": 0, "screenHeight": 0}\n' "$ECID" > "$O/machine.json"
          du -sh "$O"; ls -la "$O"
          cd "$RUNNER_TEMP/export" && zip -0 -qr Watch7-18.zip Watch7-18 && ls -la Watch7-18.zip
        shell: bash
      - name: Upload the watch (private repo only; contains Apple firmware)
        uses: actions/upload-artifact@v4
        with:
          name: Watch7-18-for-Monolith
          path: ${{ runner.temp }}/export/Watch7-18.zip
          compression-level: 0
          retention-days: 3
      - name: Restore log tail
        if: always()
        run: tail -60 "$RUNNER_TEMP/cloudos-restore.log" 2>/dev/null | cut -c1-200 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-logs
          path: |
            ${{ runner.temp }}/prepare.log
            ${{ runner.temp }}/kc-*.log
            ${{ runner.temp }}/watch-restore.log
            ${{ runner.temp }}/restored-system.log
            ${{ runner.temp }}/patch.log
            ${{ runner.temp }}/watch-boot.log
            ${{ runner.temp }}/watch-boot.png
            ${{ runner.temp }}/cloudos-restore.log
