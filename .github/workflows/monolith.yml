# Builds the author's Monolith (GPL-2.0-or-later) on the runner and runs its engine tests, to see what works
# before we change anything. Nothing from Apple is downloaded here.
name: Monolith

on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/monolith.yml'
      - 'monolith/**'

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Clone Monolith
        run: git clone --depth 1 https://github.com/MakrSas/Monolith.git "$RUNNER_TEMP/Monolith"
      - name: Tools
        run: brew install pkg-config libslirp glib libplist libusbmuxd libimobiledevice libimobiledevice-glue libtatsu libzip curl cmake meson ninja
      - name: Restore stack for the Mac
        working-directory: ${{ runner.temp }}/Monolith
        run: tools/build_ios_restore.sh mac 2>&1 | tail -30
      - name: "make: engine, tools and tests"
        working-directory: ${{ runner.temp }}/Monolith
        shell: bash
        run: |
          make -k -j4 all 2>&1 | tail -60
      - name: Run the tests
        working-directory: ${{ runner.temp }}/Monolith
        shell: bash
        run: |
          ulimit -s 65520
          make test 2>&1 | tail -60
