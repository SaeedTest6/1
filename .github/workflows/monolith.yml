# Builds the author's Monolith engine (GPL-2.0-or-later) on a real arm64 macOS runner and runs its tests,
# to see what state the code we want to build on is in. Nothing from Apple is downloaded here.
name: Monolith

on:
  workflow_dispatch: {}
  push:
    paths: ['.github/workflows/monolith.yml']

jobs:
  engine:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Clone Monolith
        run: git clone --depth 1 https://github.com/MakrSas/Monolith.git "$RUNNER_TEMP/mono"
        shell: bash
      - name: Build and run its tests
        working-directory: ${{ runner.temp }}/mono
        run: |
          git log -1 --format='%h %ad %s' --date=short
          (ulimit -s 65520; make -j4 test) 2>&1 | tee "$RUNNER_TEMP/mono-test.log" | tail -60
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monolith-log
          path: ${{ runner.temp }}/mono-test.log
